<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" role="img" aria-labelledby="title desc">
<title id="title">Matched local Firefox opening</title><desc id="desc">Interleaved local October 17 and October 18 file openings at 1, 10 and 50 MB. Bars show polled medians in seconds. Three profiles per cell were planned.</desc>
<style>:root{color-scheme:light dark;color:light-dark(#17212e,#e2e8f0)}</style>
<g fill="currentColor" font-family="system-ui, sans-serif"><text x="4" y="25" font-size="20">Matched local Firefox opening</text><text x="4" y="48" font-size="12">Same host and browser budget. Local production builds, not the CDN.</text><text x="4" y="95" font-size="12">1 MB</text><text x="75" y="95" font-size="12">Oct 17</text><rect x="160" y="84" width="10.55" height="12" opacity="0.45"/><text x="595" y="95" font-size="12">0.358 s, 3/3</text><text x="75" y="120" font-size="12">Oct 18</text><rect x="160" y="109" width="8.56" height="12" opacity="0.45"/><text x="595" y="120" font-size="12">0.291 s, 3/3</text><text x="4" y="161" font-size="12">10 MB</text><text x="75" y="161" font-size="12">Oct 17</text><rect x="160" y="150" width="79.41" height="12" opacity="0.45"/><text x="595" y="161" font-size="12">2.699 s, 3/3</text><text x="75" y="186" font-size="12">Oct 18</text><rect x="160" y="175" width="81.43" height="12" opacity="0.45"/><text x="595" y="186" font-size="12">2.767 s, 3/3</text><text x="4" y="227" font-size="12">50 MB</text><text x="75" y="227" font-size="12">Oct 17</text><rect x="160" y="216" width="407.99" height="12" opacity="0.45"/><text x="595" y="227" font-size="12">13.866 s, 3/3</text><text x="75" y="252" font-size="12">Oct 18</text><rect x="160" y="241" width="420.00" height="12" opacity="0.45"/><text x="595" y="252" font-size="12">14.274 s, 3/3</text><text x="4" y="294" font-size="12">Polled medians. DOM timing and each raw range are in the table and download.</text></g></svg>
