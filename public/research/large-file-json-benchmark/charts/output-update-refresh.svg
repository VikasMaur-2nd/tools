<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 367" role="img" aria-labelledby="title desc"><title id="title">Scalar-edit output comparison at 50 MB</title><desc id="desc">Retained October 17 output intervals and fresh October 18 intervals. Same fixture data, method, memory budget and host. Shared-host variation remains. Missing visible intervals are not estimated.</desc><style>:root{color-scheme:light dark;color:light-dark(#17212e,#e2e8f0)}</style><g fill="currentColor" font-family="system-ui,sans-serif"><text x="3.0" y="25.0" font-size="20">50 MB first-caret visible output after scalar edits</text><text x="3.0" y="49.0" font-size="12">After Edit anyway. Clock starts at final trusted keydown. Three profiles per format.</text><text x="3.0" y="96.0" font-size="15">minified</text><text x="3.0" y="135.0" font-size="12">Oct 17</text><rect x="200" y="122" width="343.1" height="18" fill-opacity="0.4"/><text x="553.1" y="136.0" font-size="12">8.987 s, 3/3</text><text x="3.0" y="169.0" font-size="12">Oct 18</text><rect x="200" y="156" width="12.5" height="18" fill-opacity="1"/><text x="222.5" y="170.0" font-size="12">0.327 s, 3/3</text><text x="3.0" y="214.0" font-size="15">prettified</text><text x="3.0" y="253.0" font-size="12">Oct 17</text><rect x="200" y="240" width="378.7" height="18" fill-opacity="0.4"/><text x="588.7" y="254.0" font-size="12">9.918 s, 3/3</text><text x="3.0" y="287.0" font-size="12">Oct 18</text><rect x="200" y="274" width="13.5" height="18" fill-opacity="1"/><text x="223.5" y="288.0" font-size="12">0.353 s, 3/3</text><text x="3.0" y="340.0" font-size="12">Other caret positions and structural edits have separate confirmation limits.</text></g></svg>
