"12" y="412" font-size="12" >10 MB</text><text x="92" y="412" font-size="12" >674 to view, 674 full</text><text x="12" y="432" font-size="12" >50 MB</text><text x="92" y="432" font-size="12" >2190 to view, 2190 full *</text><text x="0" y="464" font-size="13" >JSON Formatter Online</text><text x="12" y="487" font-size="12" >1 MB</text><text x="92" y="487" font-size="12" >158 to view, 221 full</text><text x="12" y="507" font-size="12" >10 MB</text><text x="92" y="507" font-size="12" >288 to view, 427 full</text><text x="12" y="527" font-size="12" >50 MB</text><text x="92" y="527" font-size="12" >1126 to view, 1126 full</text><text x="0" y="559" font-size="13" >JSONLint</text><text x="12" y="582" font-size="12" >1 MB</text><text x="92" y="582" font-size="12" >646 to view, 861 full</text><text x="12" y="602" font-size="12" >10 MB</text><text x="92" y="602" font-size="12" >1654 to view, 2270 full *</text><text x="12" y="622" font-size="12" >50 MB</text><text x="92" y="622" font-size="12" >2167 to view, 2167 full *</text><text x="0" y="659" font-size="11" >* At least one run hit the total-browser cap. The cap is not per renderer.</text></g></svg>
