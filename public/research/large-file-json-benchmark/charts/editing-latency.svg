<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" role="img" aria-labelledby="title desc"><title id="title">Typing latency, minified and prettified</title><desc id="desc">Median and p95 trusted keydown-to-next-rAF time by tool, data size and source format. Event Timing bounds, output updates and failure outcomes are reported separately.</desc><style>:root{color-scheme:light dark;color:light-dark(#17212e,#e2e8f0)}</style><g fill="currentColor" font-family="system-ui, sans-serif"><text x="0" y="24" font-size="20" >Typing response by source format</text><text x="0" y="48" font-size="11" >rAF median and p95 in ms. Log scale. Circle marks median; line ends at p95.</text><text x="0" y="68" font-size="11" >Solid: minified. Outline: prettified. Missing verified keys stay unmeasured.</text><text x="0" y="100" font-size="11" >Code Beautify JSON Viewer</text><text x="225" y="100" font-size="11" >100 KB</text><text x="320" y="100" font-size="11" >Not measured</text><text x="0" y="125" font-size="11" >JSON Beautifier</text><text x="225" y="125" font-size="11" >100 KB</text><text x="320" y="125" font-size="11" >Not measured</text><text x="0" y="150" font-size="11" >Tool Kumar</text><text x="225" y="150" font-size="11" >100 KB</text><line x1="476.8" y1="146" x2="560.0" y2="146" stroke="currentColor" opacity="0.55" /><circle cx="476.8" cy="146" r="4" fill="currentColor" fill-opacity="1" stroke="currentColor" /><text x="580" y="150" font-size="11" >73.1 / 727.6</text><text x="0" y="175" font-size="11" >Tool Kumar</text><text x="225" y="175" font-size="11" >100 KB</text><line x1="441.7" y1="171" x2="460.0" y2="171" stroke="currentColor" opacity="0.55" /><circle cx="441.7" cy="171" r="4" fill="currentColor" fill-opacity="0" stroke="currentColor" /><text x="580" y="175" font-size="11" >27.3 / 45.7</text><text x="0" y="200" font-size="11" >JSON Formatter Online</text><text x="225" y="200" font-size="11" >1 MB</text><text x="320" y="200" font-size="11" >Not measured</text><text x="0" y="225" font-size="11" >JSON Formatter Online</text><text x="225" y="225" font-size="11" >1 MB</text><text x="320" y="225" font-size="11" >Not measured</text><text x="0" y="250" font-size="11" >Tool Kumar</text><text x="225" y="250" font-size="11" >1 MB</text><line x1="411.7" y1="246" x2="428.3" y2="246" stroke="currentColor" opacity="0.55" /><circle cx="411.7" cy="246" r="4" fill="currentColor" fill-opacity="1" stroke="currentColor" /><text x="580" y="250" font-size="11" >11.4 / 18.6</text><text x="0" y="275" font-size="11" >Tool Kumar</text><text x="225" y="275" font-size="11" >1 MB</text><line x1="412.3" y1="271" x2="428.2" y2="271" stroke="currentColor" opacity="0.55" /><circle cx="412.3" cy="271" r="4" fill="currentColor" fill-opacity="0" stroke="currentColor" /><text x="580" y="275" font-size="11" >11.6 / 18.5</text><text x="0" y="300" font-size="11" >Tool Kumar</text><text x="225" y="300" font-size="11" >10 MB</text><line x1="418.8" y1="296" x2="446.8" y2="296" stroke="currentColor" opacity="0.55" /><circle cx="418.8" cy="296" r="4" fill="currentColor" fill-opacity="1" stroke="currentColor" /><text x="580" y="300" font-size="11" >14.1 / 31.5</text><text x="0" y="325" font-size="11" >Tool Kumar</text><text x="225" y="325" font-size="11" >10 MB</text><line x1="422.9" y1="321" x2="444.3" y2="321" stroke="currentColor" opacity="0.55" /><circle cx="422.9" cy="321" r="4" fill="currentColor" fill-opacity="0" stroke="currentColor" /><text x="580" y="325" font-size="11" >15.9 / 29.4</text><text x="0" y="350" font-size="11" >Tool Kumar</text><text x="225" y="350" font-size="11" >50 MB</text><text x="320" y="350" font-size="11" >Not measured</text><text x="0" y="375" font-size="11" >Tool Kumar</text><text x="225" y="375" font-size="11" >50 MB</text><text x="320" y="375" font-size="11" >Not measured</text><text x="0" y="408" font-size="11" >Opening failures and incomplete bursts remain in the table and download.</text></g></svg>
