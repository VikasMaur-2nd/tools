<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-labelledby="title desc" style="color:inherit;font-family:system-ui,sans-serif"><title id="title">50 MB typing with the separate 6 GiB browser budget</title><desc id="desc">Three matched profiles per source format are required for timing. Event Timing median and p95 are labeled. Original cap failures remain in the main table.</desc><text x="20" y="28" fill="currentColor" font-size="19">50 MB typing after Edit anyway, 6 GiB browser budget</text><text x="20" y="53" fill="currentColor" font-size="13">Tool Kumar 925fc3c, October 17. Event Timing, separate from rAF.</text><text x="20" y="90" fill="currentColor" font-size="13">prettified, 3/3 complete profiles</text><rect x="290" y="75" width="272.0" height="20" fill="currentColor" opacity=".2"/><rect x="290" y="75" width="158.7" height="20" fill="currentColor" opacity=".8"/><text x="640" y="90" fill="currentColor" font-size="13">56 / 96 ms</text><text x="20" y="160" fill="currentColor" font-size="13">minified, 3/3 complete profiles</text><rect x="290" y="145" width="294.6" height="20" fill="currentColor" opacity=".2"/><rect x="290" y="145" width="136.0" height="20" fill="currentColor" opacity=".8"/><text x="640" y="160" fill="currentColor" font-size="13">48 / 104 ms</text><text x="20" y="253" fill="currentColor" font-size="12">Solid bar: median. Pale bar: p95. Event durations below 16 ms are censored.</text></svg>
