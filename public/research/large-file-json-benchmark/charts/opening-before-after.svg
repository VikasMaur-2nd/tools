<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 464" role="img" aria-labelledby="title desc"><title id="title">Tool Kumar opening history</title><desc id="desc">Original October 15 version, October 17 version and current October 18 version. Hardware and budget differ across the original comparison. Exact ranges and counts are in the table.</desc><style>:root{color-scheme:light dark;color:light-dark(#17212e,#e2e8f0)}</style><g fill="currentColor" font-family="system-ui,sans-serif"><text x="3.0" y="25.0" font-size="20">Tool Kumar opening, seconds</text><text x="3.0" y="49.0" font-size="12">Original: 2 CPUs / 2.5 GiB. Later: 4 CPUs / 6 GiB. This is not a code-only control.</text><text x="3.0" y="85.0" font-size="14">1 MB</text><text x="3.0" y="121.0" font-size="12">Oct 15, original</text><rect x="200" y="109" width="32.5" height="17" fill-opacity="0.25"/><text x="242.5" y="122.0" font-size="12">0.890 s</text><text x="3.0" y="148.0" font-size="12">Oct 17</text><rect x="200" y="136" width="14.0" height="17" fill-opacity="0.55"/><text x="224.0" y="149.0" font-size="12">0.383 s</text><text x="3.0" y="175.0" font-size="12">Oct 18, current</text><rect x="200" y="163" width="12.3" height="17" fill-opacity="1"/><text x="222.3" y="176.0" font-size="12">0.336 s</text><text x="3.0" y="208.0" font-size="14">10 MB</text><text x="3.0" y="244.0" font-size="12">Oct 15, original</text><rect x="200" y="232" width="90.6" height="17" fill-opacity="0.25"/><text x="300.6" y="245.0" font-size="12">2.482 s</text><text x="3.0" y="271.0" font-size="12">Oct 17</text><rect x="200" y="259" width="57.4" height="17" fill-opacity="0.55"/><text x="267.4" y="272.0" font-size="12">1.572 s</text><text x="3.0" y="298.0" font-size="12">Oct 18, current</text><rect x="200" y="286" width="52.3" height="17" fill-opacity="1"/><text x="262.3" y="299.0" font-size="12">1.433 s</text><text x="3.0" y="331.0" font-size="14">50 MB</text><text x="3.0" y="367.0" font-size="12">Oct 15, original</text><rect x="200" y="355" width="360.0" height="17" fill-opacity="0.25"/><text x="570.0" y="368.0" font-size="12">9.857 s</text><text x="3.0" y="394.0" font-size="12">Oct 17</text><rect x="200" y="382" width="330.6" height="17" fill-opacity="0.55"/><text x="540.6" y="395.0" font-size="12">9.051 s</text><text x="3.0" y="421.0" font-size="12">Oct 18, current</text><rect x="200" y="409" width="303.4" height="17" fill-opacity="1"/><text x="513.4" y="422.0" font-size="12">8.307 s</text></g></svg>
