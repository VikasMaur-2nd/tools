<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 494" role="img" aria-labelledby="title desc"><title id="title">Same-hardware local code comparison</title><desc id="desc">Three rounds per source and size on the resized four-CPU host at the same 2.5 GiB browser budget. Clean local production builds, not CDN timings.</desc><style>:root{color-scheme:light dark;color:light-dark(#17212e,#e2e8f0)}</style><g fill="currentColor" font-family="system-ui, sans-serif"><text x="3" y="24" font-size="20" >Local build comparison</text><text x="3" y="48" font-size="12" >Three rounds per source and size. Local builds, not CDN.</text><text x="3" y="84" font-size="14" >1 MB</text><text x="3" y="116" font-size="12" >Oct 15, original</text><rect x="130" y="104" width="23.0" height="18" fill-opacity="0.35" /><text x="163.00780935512438" y="118" font-size="12" >0.866 s; 3/3</text><text x="3" y="144" font-size="12" >Oct 15, interim</text><rect x="130" y="132" width="62.8" height="18" fill-opacity="0.65" /><text x="202.83310522502217" y="146" font-size="12" >2.365 s; 3/3</text><text x="3" y="172" font-size="12" >Oct 17</text><rect x="130" y="160" width="10.4" height="18" fill-opacity="1" /><text x="150.44118831011997" y="174" font-size="12" >0.393 s; 3/3</text><text x="3" y="208" font-size="14" >10 MB</text><text x="3" y="240" font-size="12" >Oct 15, original</text><rect x="130" y="228" width="54.0" height="18" fill-opacity="0.35" /><text x="193.95942355687947" y="242" font-size="12" >2.031 s; 3/3</text><text x="3" y="268" font-size="12" >Oct 15, interim</text><rect x="130" y="256" width="75.7" height="18" fill-opacity="0.65" /><text x="215.6919732710732" y="270" font-size="12" >2.849 s; 3/3</text><text x="3" y="296" font-size="12" >Oct 17</text><rect x="130" y="284" width="39.7" height="18" fill-opacity="1" /><text x="179.7455921423396" y="298" font-size="12" >1.496 s; 3/3</text><text x="3" y="332" font-size="14" >50 MB</text><text x="3" y="364" font-size="12" >Oct 15, original</text><rect x="130" y="352" width="242.5" height="18" fill-opacity="0.35" /><text x="382.485307141132" y="366" font-size="12" >9.127 s; 3/3</text><text x="3" y="392" font-size="12" >Oct 15, interim</text><rect x="130" y="380" width="330.0" height="18" fill-opacity="0.65" /><text x="470.0" y="394" font-size="12" >12.421 s; 3/3</text><text x="3" y="420" font-size="12" >Oct 17</text><rect x="130" y="408" width="229.8" height="18" fill-opacity="1" /><text x="369.7858465501972" y="422" font-size="12" >8.649 s; 3/3</text><text x="3" y="468" font-size="11" >Polled medians. The table also gives ranges and precise in-page timing.</text></g></svg>
